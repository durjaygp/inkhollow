<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b026ff" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>
  </defs>
  
  <!-- Hollow Circle representing 'Hollow' -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#neonGlow)" stroke-width="6" stroke-dasharray="160 60" transform="rotate(-45 50 50)" />
  
  <!-- Stylized Pen Nib / Ink Drop -->
  <path d="M 50 15 C 60 40, 65 60, 50 85 C 35 60, 40 40, 50 15 Z" fill="#ffffff" />
  <path d="M 50 45 L 50 75" stroke="#121212" stroke-width="3" stroke-linecap="round" />
  <circle cx="50" cy="40" r="3" fill="#121212" />

  <!-- Typography -->
  <text x="105" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff">InkHollow</text>
  <text x="105" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="300" letter-spacing="4" fill="#a0a0a0">STUDIO</text>
</svg>
